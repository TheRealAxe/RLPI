# À copier dans le repo de l'app : .github/workflows/deploy.yml
#
# À chaque push sur main : construit les deux images Docker, les publie sur ghcr.io (packages privés),
# puis demande à Coolify de redéployer le tableau de bord et les workers.
#   Dockerfile         → ghcr.io/<repo>          tableau de bord (rlpi.serve)
#   Dockerfile.worker  → ghcr.io/<repo>-worker   worker de traitement des parties (rlpi.worker)
#
# Secrets à créer dans le repo (Settings > Secrets and variables > Actions) :
#   COOLIFY_TOKEN         jeton Coolify, permission « deploy » uniquement (fourni par Luc)
#   COOLIFY_APP_UUID      identifiant de l'app tableau de bord dans Coolify (fourni par Luc)
#   COOLIFY_WORKER_UUIDS  identifiants des workers, séparés par des virgules (facultatif tant qu'il n'y en a pas)
name: Build & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Nom de l'image (ghcr.io exige des minuscules)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}-worker:latest
            ${{ env.IMAGE }}-worker:sha-${{ github.sha }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max

      - name: Déploiement sur Coolify
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          COOLIFY_WORKER_UUIDS: ${{ secrets.COOLIFY_WORKER_UUIDS }}
        run: |
          # Retire espaces et retours à la ligne collés par erreur avec les secrets
          TOKEN="$(printf '%s' "$COOLIFY_TOKEN" | tr -d '[:space:]')"
          UUIDS="$(printf '%s,%s' "$COOLIFY_APP_UUID" "$COOLIFY_WORKER_UUIDS" | tr -d '[:space:]')"
          for UUID in ${UUIDS//,/ }; do
            echo "Redéploiement de $UUID"
            curl -fsS -X POST \
              -H "Authorization: Bearer $TOKEN" \
              "https://coolify.lainox.quest/api/v1/deploy?uuid=$UUID"
          done
