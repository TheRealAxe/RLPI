<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profil RLPI</title>
<style>
/* ======================================================================
   RLPI · Plateau — jetons (copie de Design/rlpi-plateau/design/tokens.css)
   ====================================================================== */
/*__FONTS__*/  /* polices locales intégrées à la génération (rlpi.fonts) */
:root {
  color-scheme: dark;
  --surface: #0b0d11;
  --surface-alt: #171a21;
  --panel: #f3f3ee;
  --panel-alt: #e2e2db;
  --ink: #f3f3ee;
  --ink-muted: #9aa1ab;
  --panel-ink: #0b0d11;
  --panel-muted: #55585f;
  --rule: #2a2f38;
  --panel-rule: #c9c9c1;
  --accent: #d4ff3a;
  --accent-ink: #d4ff3a;
  --on-accent: #0b0d11;
  --good: #1d63c9;
  --good-on-dark: #6eb0ff;
  --bad: #e2622e;
  --bad-ink: #b8410f;
  --me: #d4ff3a;
  --mate-1: #ff9a5c;
  --mate-2: #5fd0a4;
  --ref: #7c838d;
  --map-0: #151922;
  --map-1: #1c3155;
  --map-2: #24508f;
  --map-3: #3d7fd6;
  --map-4: #9cc6ff;
  --div-neg: #e2622e;
  --div-neg-soft: #7a3b22;
  --div-mid: #20242c;
  --div-pos-soft: #25467a;
  --div-pos: #4f9bff;
  --focus: #d4ff3a;

  --font-display: "Sofia Sans Extra Condensed", "Arial Narrow", sans-serif;
  --font-sans: "Sofia Sans", "Helvetica Neue", Arial, sans-serif;

  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
  --space-5: 20px; --space-6: 24px; --space-8: 32px; --space-12: 48px;

  --cut-sm: 10px; --cut-md: 14px; --cut-lg: 16px;
}
/* ----------------------------------------------------------------------
   Jetons AJOUTÉS (absents de tokens.css, à y reporter) :
   texte sur --good, échelle typographique, tailles « display »
   intermédiaires citées dans COMPONENTS.md, gabarits de mise en page.
   ---------------------------------------------------------------------- */
:root {
  --on-good: #ffffff;              /* texte blanc sur --good (5,7:1, tokens.json) */
  --fs-score-xl: 150px; --fs-score: 44px; --fs-name: 40px; --fs-title: 28px;
  --fs-lead: 18px; --fs-body: 15px; --fs-small: 13px; --fs-tag: 12px; --fs-axis: 11px;
  --dx-64: 64px; --dx-56: 56px; --dx-34: 34px; --dx-30: 30px; --dx-26: 26px; --dx-24: 24px; --dx-22: 22px;
  --page-max: 1100px; --page-pad: 30px; --side-col: 300px; --method-w: 420px; --sym: 14px;
  --t-move: 150ms;
}
@media (max-width: 720px) {
  :root { --fs-score-xl: 104px; --dx-64: 44px; --dx-56: 44px; --page-pad: 16px; }
}

/* ======================================================================
   Grammaire Plateau (Design/rlpi-plateau/design/plateau.css)
   ====================================================================== */
* { box-sizing: border-box; }
html, body { margin: 0; }
.pl-page { background: var(--surface); color: var(--ink); font-family: var(--font-sans); font-size: var(--fs-body);
  line-height: 22px; font-weight: 500; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
.pl-page :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.pl-dx { font-family: var(--font-display); font-style: italic; font-weight: 900; text-transform: uppercase; line-height: .85; }
.pl-score-xl { font-size: var(--fs-score-xl); }
.pl-score { font-size: var(--fs-score); }
.pl-name { font-size: var(--fs-name); }
.pl-title { font-size: var(--fs-title); line-height: .9; }
.pl-body { font-size: var(--fs-body); line-height: 22px; font-weight: 500; }
.pl-small { font-size: var(--fs-small); line-height: 18px; font-weight: 500; }
.pl-tag { font-size: var(--fs-tag); line-height: 16px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
.pl-muted { color: var(--ink-muted); }
.pl-cut { clip-path: polygon(var(--cut-md) 0, 100% 0, calc(100% - var(--cut-md)) 100%, 0 100%); }
.pl-cutr { clip-path: polygon(0 0, 100% 0, calc(100% - var(--cut-lg)) 100%, 0 100%); }
.pl-panel { background: var(--panel); color: var(--panel-ink); }
.pl-panel .pl-muted { color: var(--panel-muted); }
.pl-volt { background: var(--accent); color: var(--on-accent); }
.pl-header { display: flex; align-items: stretch; flex-wrap: wrap; row-gap: var(--space-2); }
.pl-header > .pl-volt { padding: 10px 26px 10px 20px; display: flex; align-items: center; }
.pl-header > .pl-panel { padding: 6px 30px 4px 24px; margin-left: -6px; display: flex; align-items: center; }
.pl-form { padding: 6px 12px 8px 16px; text-align: center; display: block; }
.pl-form--up { background: var(--good); color: var(--on-good); }
.pl-form--down { background: var(--bad); color: var(--panel-ink); }
.pl-form--current { outline: 3px solid var(--accent); outline-offset: -3px; }
.pl-row { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-2) 0; border-bottom: 1px solid var(--rule); }
.pl-good { color: var(--good-on-dark); }
.pl-panel .pl-good { color: var(--good); }
.pl-bad { color: var(--bad); }
.pl-panel .pl-bad { color: var(--bad-ink); }

/* ======================================================================
   Application
   ====================================================================== */
.page { max-width: var(--page-max); margin: 0 auto; padding: 26px var(--page-pad) var(--space-12); }
.skip { position: absolute; left: -999px; top: 0; }
.skip:focus { left: var(--space-2); top: var(--space-2); z-index: 30; background: var(--accent); color: var(--on-accent); padding: var(--space-2) var(--space-3); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
a { color: inherit; }
h1, h2, h3, h4, p { margin: 0; font-weight: inherit; font-size: inherit; }
[hidden] { display: none !important; }

/* --- barre du haut ------------------------------------------------------ */
.top { display: flex; justify-content: space-between; align-items: center; gap: var(--space-4); margin-bottom: 22px; flex-wrap: wrap; }
.tabs { display: flex; gap: var(--space-1); overflow-x: auto; scrollbar-width: none; max-width: 100%; }
.tab > span { display: block; padding: 9px 26px; background: var(--surface-alt); color: var(--ink-muted); white-space: nowrap; }
.tab:hover > span { color: var(--ink); }
.tab[aria-selected="true"] > span { background: var(--panel); color: var(--panel-ink); }
.controls { display: flex; gap: var(--space-4); align-items: center; flex-wrap: wrap; color: var(--ink-muted); }
.controls label { display: inline-flex; align-items: center; gap: var(--space-2); }
.sel { font: inherit; font-weight: 800; color: var(--ink); background: var(--surface-alt); border: 1px solid var(--rule);
  padding: var(--space-1) var(--space-2); border-radius: 0; }
.linkbtn { color: var(--ink); font-weight: 800; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--rule); }
.linkbtn:hover { text-decoration-color: var(--ink); }
.home { color: var(--ink-muted); text-decoration: none; }
.home:hover, .home:focus-visible { color: var(--ink); }
.ctx { display: flex; align-items: center; padding-left: var(--space-4); }
/* bandeau de période et badges de portée : chaque bloc dit sur quelles parties il porte */
.periodbar { display: flex; align-items: center; gap: var(--space-2) var(--space-3); flex-wrap: wrap; margin: 0 0 var(--space-5);
  padding: 8px 14px; background: var(--surface-alt); border-left: 4px solid var(--accent); }
.periodbar b { font-weight: 800; }
.periodbar form { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; margin-left: auto; }
.periodbar button { padding: 4px 12px; background: var(--ink); color: var(--surface); font-weight: 800; }
.scope { display: inline-block; font-size: var(--fs-axis); line-height: 14px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
  padding: 1px 7px; border: 1.5px solid currentColor; white-space: nowrap; vertical-align: middle; }
.scope--p { color: var(--ink-muted); }
.scope--m { color: var(--accent-ink, var(--accent)); }
.scope--e { color: var(--ink-muted); border-style: dashed; }
.pl-panel .scope--p, .pl-panel .scope--e { color: var(--panel-muted); }
.costs .pl-row { cursor: pointer; }
.mjlist a { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: var(--space-3); align-items: baseline; padding: 8px 0;
  border-bottom: 1px solid var(--rule); color: inherit; text-decoration: none; }
.mjlist a:hover b { text-decoration: underline; }
tr.go { cursor: pointer; }
tr.go:hover td { background: var(--surface-alt); }
header.pl-header { margin-bottom: var(--space-5); }

/* --- vues --------------------------------------------------------------- */
.view { outline: none; }
.view.enter { animation: slide var(--t-move) ease-out; }
@keyframes slide { from { transform: translateX(8px); } to { transform: none; } }
.lead { font-size: var(--fs-lead); line-height: 26px; max-width: 780px; margin-bottom: var(--space-5); }
.block { margin-top: var(--space-6); }
.bh { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-3); margin-bottom: var(--space-2); flex-wrap: wrap; }
.bt { display: flex; align-items: center; gap: var(--space-2); }
.read { margin: var(--space-1) 0 var(--space-3); max-width: 760px; }
.g-side { display: grid; grid-template-columns: var(--side-col) minmax(0, 1fr); gap: var(--space-5); }
.g-side-r { display: grid; grid-template-columns: minmax(0, 1fr) var(--side-col); gap: var(--space-5); }
.g-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px; }
.carton { padding: 18px 38px 18px 22px; }
.mi { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; font-size: var(--fs-small);
  font-weight: 800; color: var(--ink-muted); }
.mi:hover { color: var(--ink); }
.pl-panel .mi { color: var(--panel-muted); }
.pl-panel .mi:hover { color: var(--panel-ink); }
.sym { display: inline-block; flex: none; width: var(--sym); height: var(--sym); vertical-align: -2px; }
.cta { display: block; width: 100%; margin-top: 22px; }
.cta > span { display: block; padding: 12px 24px; text-align: center; }
.back { color: var(--ink-muted); margin-bottom: var(--space-3); }
.back:hover { color: var(--ink); }
.note { margin-top: var(--space-2); }
svg { display: block; overflow: visible; }
svg text { font-family: var(--font-sans); font-size: var(--fs-axis); font-weight: 700; fill: var(--ink-muted); }
.pl-panel svg text { fill: var(--panel-muted); }
.empty { color: var(--ink-muted); padding: var(--space-4) 0; }

/* --- Ma forme ----------------------------------------------------------- */
.scorebug { padding: 18px 34px 18px 22px; align-self: start; }
.scorebug .big { display: flex; align-items: flex-end; gap: 6px; }
.scorebug .of { font-size: var(--dx-30); color: var(--panel-muted); padding-bottom: 10px; }
.trio .pl-row .nm { font-size: var(--dx-26); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trio .pl-row .vl { font-size: var(--dx-34); }
.formhead { display: flex; justify-content: space-between; gap: var(--space-3); margin: 18px 0 var(--space-2); flex-wrap: wrap; }
.formgrid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: var(--space-1); }
.formcell .pl-tag { font-size: var(--fs-axis); }
.formcell .pl-dx { font-size: var(--dx-34); }
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: var(--space-3); }
.kpi { padding: 14px 26px 14px 16px; display: flex; flex-direction: column; gap: var(--space-1); min-width: 0; }
.kpi .v { margin: var(--space-1) 0; }
.kpi .v small { font-size: var(--dx-22); color: var(--panel-muted); margin-left: 2px; }
.kpi .cmp { display: flex; flex-direction: column; gap: 2px; }
.kpi .cmp span { display: inline-flex; align-items: center; gap: 6px; }
.review { display: flex; align-items: stretch; margin-top: var(--space-6); }
.review > .pl-volt { padding: 12px 28px 12px 20px; display: flex; align-items: center; flex: none; }
.review > .pl-panel { flex: 1; margin-left: -6px; padding: 10px 30px 10px 24px; display: flex; align-items: center; gap: var(--space-5); flex-wrap: wrap; }
.review .when { font-size: var(--dx-30); }
.review .txt { flex: 1; min-width: 200px; }
.review .go { text-decoration: underline; text-underline-offset: 3px; }

/* --- Ce match ----------------------------------------------------------- */
.picker { display: flex; align-items: center; gap: var(--space-2); justify-content: flex-end; margin-bottom: var(--space-3); flex-wrap: wrap; }
.picker .step { padding: var(--space-1) var(--space-2); background: var(--surface-alt); font-weight: 800; }
.picker .step:disabled { opacity: .4; cursor: default; }
.resultbar { display: flex; align-items: stretch; margin-bottom: 22px; }
.resultbar > .badge { padding: 10px 30px 8px 22px; display: flex; align-items: center; gap: 14px; flex: none; }
.resultbar > .badge .pl-dx { font-size: var(--dx-56); }
.resultbar > .pl-panel { flex: 1; margin-left: -6px; padding: 10px 30px 10px 24px; display: flex; align-items: center; }
.bg-good { background: var(--good); color: var(--on-good); }
.bg-bad { background: var(--bad); color: var(--panel-ink); }
.brow { display: grid; grid-template-columns: minmax(120px, 200px) 56px minmax(0, 1fr) 50px; gap: 14px; align-items: center;
  padding: 9px 0; border-bottom: 1px solid var(--panel-rule); }
.brow .lab { font-weight: 700; }
.brow .w { text-align: right; }
.brow .n { font-size: var(--dx-30); text-align: right; }
.board .rk { font-size: var(--dx-22); width: 28px; color: var(--ink-muted); }
.board .nm { font-size: var(--dx-26); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.board .vl { font-size: var(--dx-34); }
.board .opp .nm, .board .opp .vl { color: var(--ink-muted); }
.board .me .nm { color: var(--me); }
.h44 { font-size: var(--fs-score); margin-bottom: 6px; }
.fiches { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-top: var(--space-4); }
.fiche { padding: 14px 30px 16px 18px; display: flex; flex-direction: column; }
.fiche .top2 { display: flex; justify-content: space-between; align-items: baseline; }
.fiche .clk { font-size: var(--dx-22); }
.fiche .kind { font-size: var(--fs-title); margin-top: 6px; }
.fiche .cost { font-size: var(--fs-score); color: var(--bad-ink); margin-top: 2px; }
.fiche .open { margin-top: var(--space-2); text-decoration: underline; text-underline-offset: 3px; align-self: flex-start; }
.others .pl-row { display: grid; grid-template-columns: 32px 70px 60px minmax(0, 1fr) 90px 70px; gap: var(--space-3); width: 100%; text-align: left; }
.others .pl-row:hover { background: var(--surface-alt); }
.gainrow { display: grid; grid-template-columns: minmax(110px, 170px) minmax(0, 1fr) 70px; gap: var(--space-3); align-items: center; padding: 6px 0; border-bottom: 1px solid var(--rule); }
.gainrow .vl { font-size: var(--dx-26); text-align: right; }
.legend { display: flex; flex-wrap: wrap; gap: var(--space-1) var(--space-4); align-items: center; margin-top: var(--space-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { display: inline-block; width: 12px; height: 12px; flex: none; }

/* --- Mon jeu ------------------------------------------------------------ */
.chip { display: inline-block; padding: 6px 22px; margin-bottom: 6px; }
.tf { display: grid; grid-template-columns: minmax(0, 1fr) 54px; gap: 10px; align-items: center; padding: var(--space-2) 0; border-bottom: 1px solid var(--rule); }
.tf .l { display: flex; justify-content: space-between; gap: var(--space-2); }
.tf .l b { font-weight: 700; }
.tf .vl { font-size: var(--dx-34); text-align: right; }
.gap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(120px, 240px) 60px; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--rule); }
.gap b { font-size: var(--fs-body); font-weight: 700; display: block; }
.gap .vl { font-size: var(--dx-24); text-align: right; }
.terrain { display: grid; grid-template-columns: 208px minmax(0, 1fr); gap: 18px; margin-top: 18px; align-items: start; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; }
.seg button { padding: 6px 12px; background: var(--surface-alt); color: var(--ink-muted); }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--panel-ink); }
.ramp { display: flex; width: 208px; margin-top: var(--space-2); }
.ramp span { flex: 1; height: 8px; }
.ramp-l { display: flex; justify-content: space-between; width: 208px; }
.cat { display: grid; grid-template-columns: minmax(110px, 170px) minmax(0, 1fr) 46px; gap: var(--space-3); align-items: center; padding: 6px 0; border-bottom: 1px solid var(--rule); }
.cat .vl { font-size: var(--dx-30); text-align: right; }
.cat .exp { color: var(--accent-ink); }
.stack { display: grid; grid-template-columns: minmax(80px, 130px) minmax(0, 1fr) 46px; gap: var(--space-3); align-items: center; padding: 5px 0; }
.stack .who { display: flex; align-items: center; gap: 6px; min-width: 0; overflow: hidden; white-space: nowrap; }
.stack .bar { display: flex; height: 24px; gap: 2px; }
.stack .bar i { display: flex; align-items: center; justify-content: center; font-style: normal; font-size: var(--fs-axis); font-weight: 800; overflow: hidden; white-space: nowrap; min-width: 0; }
.stack .p5 { text-align: right; }
details.more { margin-top: var(--space-3); }
details.more summary { cursor: pointer; font-weight: 800; }
table.t { width: 100%; border-collapse: collapse; margin-top: var(--space-2); }
table.t th { text-align: left; color: var(--ink-muted); padding: 6px var(--space-2); border-bottom: 1px solid var(--rule); }
table.t td { padding: 6px var(--space-2); border-bottom: 1px solid var(--rule); }
table.t .n { text-align: right; white-space: nowrap; }

/* --- Mon trio ----------------------------------------------------------- */
.tape-head { display: grid; grid-template-columns: minmax(0, 1fr) minmax(140px, 300px) minmax(0, 1fr); align-items: end; margin-bottom: 10px; }
.tape-head .l { text-align: right; padding-right: 18px; }
.tape-head .r { padding-left: 18px; }
.tape-head .big { font-size: var(--dx-64); white-space: nowrap; }
.tape-head .vs { text-align: center; font-size: var(--fs-name); color: var(--ink-muted); }
.tape { border-top: 3px solid var(--ink); }
.hero { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 0; margin-bottom: var(--space-8); }
.hero .id { padding: 22px 34px 24px 24px; }
.hero .id .kick { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.hero .id .nm { font-size: var(--fs-score-xl); line-height: .8; letter-spacing: -.01em; }
.hero .id .sub { font-size: var(--dx-30); margin-top: 6px; color: var(--panel-muted); }
.hero .id .tag { margin-top: 12px; max-width: 520px; }
.hero .id ul { margin: 14px 0 0; padding: 0; list-style: none; }
.hero .id li { padding: 6px 0; border-top: 1px solid var(--panel-rule); display: flex; gap: 10px; justify-content: space-between; }
.hero .id li .q { color: var(--panel-muted); white-space: nowrap; }
.hero .side { padding: 20px 4px 20px 26px; }
.hero .like { margin-top: 4px; }
.hero .like b { font-family: var(--font-display); font-style: italic; font-weight: 900; font-size: var(--dx-26); text-transform: uppercase; }
.spec { margin-top: 16px; }
.spec .r { display: grid; grid-template-columns: 112px minmax(0, 1fr) 30px; gap: 10px; align-items: center; padding: 3px 0; }
.spec .r.dim { opacity: .55; }
.spec .bar { height: 8px; background: var(--surface-alt); position: relative; }
.spec .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ink-muted); }
.spec .r.main .bar i { background: var(--accent); }
.spec .r.team .bar i { background: var(--good-on-dark); }
.trio-st { margin-top: 16px; display: flex; flex-direction: column; gap: 4px; }
.advice { display: flex; flex-direction: column; gap: 10px; }
.advice .a { background: var(--surface-alt); padding: 12px 16px 14px; border-left: 3px solid var(--accent); }
.advice .a h3 { font-size: var(--dx-24); margin: 4px 0 6px; }
.prog .chg { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--rule); }
.prog .chg .d { font-size: var(--dx-26); }
@media (max-width: 860px) { .hero { grid-template-columns: 1fr; } .hero .side { padding: 18px 0 0; } }
@media (max-width: 520px) { .hero .id { padding: 18px 22px 20px 16px; } .hero .id li { flex-direction: column; gap: 0; } .hero .id li .q { white-space: normal; } }
.syn-dir .row { display: grid; grid-template-columns: minmax(150px, 230px) 90px 90px minmax(0, 1fr); gap: var(--space-3); align-items: center; padding: 6px 0; border-bottom: 1px solid var(--rule); }
.syn-dir .row > div:nth-child(2), .syn-dir .row > div:nth-child(3) { text-align: right; }
.tape .row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(140px, 300px) minmax(0, 1fr); align-items: center; border-bottom: 1px solid var(--rule); }
.tape .row .a { text-align: right; padding: 6px 18px; }
.tape .row .b { padding: 6px 18px; }
.tape .row .pl-dx { font-size: var(--dx-26); }
.tape .row .lab { text-align: center; font-size: var(--fs-small); }
.tape .grp { padding: 14px 0 4px; text-align: center; color: var(--ink-muted); }
.win-me { color: var(--me); }

<script>
const ALL = /*__DATA__*/null;
if (!ALL) {
  document.querySelector("#main").innerHTML = `<div class="pl-panel pl-cutr carton"><h2 class="pl-dx pl-title">Gabarit sans données</h2>
    <p class="pl-small" style="margin-top:8px">La page se trouve dans <b>reports/tableau_de_bord.html</b>. Pour la régénérer :<br>
    <code>.venv/Scripts/python -m rlpi.dashboard --player "Steam:&lt;ton identifiant&gt;" --compare Pseudo1 Pseudo2</code></p></div>`;
  throw new Error("gabarit sans données");
}
const SEL = (() => { const q = new URLSearchParams(location.search).get("j"); return q && ALL.profiles[q] ? q : ALL.default; })();
const BASE = ALL.profiles[SEL], PF = BASE.perf, V = BASE.value, PS = BASE.passes, HEAT = BASE.heat;

// ================================================================== outils
const $ = s => document.querySelector(s);
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const txt = (parent, x, y, s, attrs = {}) => { const t = el("text", { x, y, ...attrs }, parent); t.textContent = s; return t; };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const NB = " ", MINUS = "−";
const num = (v, d = 1) => (v < 0 ? MINUS : "") + Math.abs(v).toFixed(d).replace(".", ",");
const sgn = (v, d = 2) => v == null ? "—" : (v >= 0 ? "+" : MINUS) + Math.abs(v).toFixed(d).replace(".", ",");
const sgnI = v => (Math.round(v) >= 0 ? "+" : MINUS) + Math.abs(Math.round(v));
const R = v => v == null ? "—" : String(Math.round(v));
const pc = v => v == null ? "—" : Math.round(v * 100) + NB + "%";
function fmt(v, unit = "") {
  if (v == null) return "—";
  const a = Math.abs(v), d = a >= 100 ? 0 : a < 1 && a !== 0 ? 2 : 1;
  const s = num(v, d);
  if (unit.startsWith("%")) return s + NB + "%";
  if (unit === "km/h") return s + NB + "km/h";
  if (unit.includes("/ 5 min")) return s + NB + "/ 5 min";
  if (unit === "/100") return R(v);
  if (unit === "/6") return num(v, 1) + NB + "/ 6";
  return s;
}
const dParts = d => { const [y, m, j] = d.slice(0, 10).split("-"); return { y, m, j, h: d.slice(11, 16).replace("-", ":") }; };
const dS = d => { const p = dParts(d); return `${p.j}.${p.m}`; };
const dC = d => { const p = dParts(d); return `${p.j}.${p.m}.${p.y.slice(2)}`; };
const dL = d => { const p = dParts(d); return `${p.j}/${p.m}/${p.y}`; };
const clock = s => s == null ? "—" : `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, "0")}`;
const ord = r => r === 1 ? "1er" : r + "e";
const joinFr = a => a.length <= 1 ? (a[0] || "") : a.slice(0, -1).join(", ") + " et " + a[a.length - 1];
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const scoreTxt = s => s ? s.replace("-", "–") : "";
const tip = $("#tip");
function showTip(ev, html) { tip.innerHTML = html; tip.style.display = "block";
  const w = tip.offsetWidth, h = tip.offsetHeight; let x = ev.clientX + 14, y = ev.clientY + 14;
  if (x + w > innerWidth - 8) x = ev.clientX - w - 14; if (y + h > innerHeight - 8) y = ev.clientY - h - 14;
  tip.style.left = Math.max(8, x) + "px"; tip.style.top = Math.max(8, y) + "px"; }
const hideTip = () => tip.style.display = "none";
function hover(node, html) { node.addEventListener("mousemove", e => showTip(e, typeof html === "function" ? html() : html));
  node.addEventListener("mouseleave", hideTip); return node; }
const width = host => Math.max(60, Math.round(host.getBoundingClientRect().width));
const mi = (id, label) => `<button class="mi" data-m="${id}" aria-label="Méthode : ${esc(label)}" title="Comment c'est calculé">ⓘ</button>`;

// ================================================================== joueurs et symboles
const SLOTS = ["mate-1", "mate-2"];
const PEERS = (BASE.peers || []).map((p, i) => ({ ...p, slot: SLOTS[i] || "mate-2", color: `var(--${SLOTS[i] || "mate-2"})`, win: i === 0 ? "win-m1" : "win-m2" }));
const peerByName = n => PEERS.find(p => p.name === n);
// symbole : me = losange, mate-1 = rond, mate-2 = carré, ref = trait. inPanel : contour sombre pour rester lisible sur un carton.
function sym(kind, inPanel = false) {
  const st = inPanel ? ` stroke="var(--panel-ink)" stroke-width="1.5"` : "";
  const body = kind === "me" ? `<path d="M7,1 L13,7 L7,13 L1,7 Z" fill="var(--me)"${st}/>`
    : kind === "mate-1" ? `<circle cx="7" cy="7" r="6" fill="var(--mate-1)"${st}/>`
    : kind === "mate-2" ? `<rect x="1" y="1" width="12" height="12" fill="var(--mate-2)"${st}/>`
    : kind === "ref" ? `<rect x="1" y="5" width="12" height="4" fill="${inPanel ? "var(--panel-muted)" : "var(--ref)"}"/>`
    : `<circle cx="7" cy="7" r="5" fill="none" stroke="var(--ink-muted)" stroke-width="1.5"/>`;
  return `<svg class="sym" viewBox="0 0 14 14" aria-hidden="true">${body}</svg>`;
}
function symSvg(svg, kind, x, y, s = 6) {
  if (kind === "me") return el("path", { d: `M${x},${y - s} L${x + s},${y} L${x},${y + s} L${x - s},${y} Z`, fill: "var(--me)" }, svg);
  if (kind === "mate-1") return el("circle", { cx: x, cy: y, r: s * .8, fill: "var(--mate-1)" }, svg);
  if (kind === "mate-2") return el("rect", { x: x - s * .75, y: y - s * .75, width: s * 1.5, height: s * 1.5, fill: "var(--mate-2)" }, svg);
  return el("rect", { x: x - 1.5, y: y - s, width: 3, height: 2 * s, fill: "var(--ref)" }, svg);
}

// ================================================================== état
let REF = BASE.default_ref, D, M;
try { const s = localStorage.getItem("rlpi-ref"); if (s && BASE.refs[s]) REF = s; } catch (e) {}
const ST = { tab: "ma-forme", match: PF ? PF.matches[PF.matches.length - 1].replay : null,
  peer: 0, terrain: "pros", evo: null };
const PFM = PF ? Object.fromEntries(PF.matches.map(m => [m.replay, m])) : {};
const VM = V ? Object.fromEntries(V.matches.map(m => [m.replay, m])) : {};
const REC = Object.fromEntries((BASE.record || []).map(r => [r.d, r]));
const refLabel = () => D.label;
// badges de portée : sur quelles parties porte un bloc
const scP = () => `<span class="scope scope--p" title="Toutes les parties de la période choisie en haut de page">Période</span>`;
const scM = () => `<span class="scope scope--m" title="Uniquement le match affiché">Ce match</span>`;
const scE = n => `<span class="scope scope--e" title="Uniquement les parties jouées dans la même équipe">Ensemble · ${n} parties</span>`;
const scX = (t, title = "") => `<span class="scope scope--e" title="${esc(title)}">${esc(t)}</span>`;
// bandeau de période : visible sur tous les onglets ; réglable quand la page est servie par rlpi.serve
function periodBar() {
  const host = $("#periodbar"), n = BASE.n_matches;
  const txt = `Période analysée : <b>${n} partie${n > 1 ? "s" : ""}</b> · ${period()}`;
  const days = ALL.dynamic ? ALL.days || [] : [];
  if (!days.length) { host.innerHTML = `<span>${txt}</span><span class="pl-muted">Tous les blocs portent sur ces parties, sauf ceux marqués ${scM()} ou ${scX("Ensemble")}.</span>`; return; }
  const F = ALL.filters || {}, d10 = x => (x || "").slice(0, 10);
  const opt = (sel, first) => `<option value="">${first}</option>` + days.map(x => `<option value="${x.d}"${x.d === d10(sel) ? " selected" : ""}>${dC(x.d)} · ${x.n} p.</option>`).join("");
  host.innerHTML = `<span>${txt}</span>
    <form id="period-form"><label>Du <select class="sel" name="du">${opt(F.du, "début")}</select></label>
      <label>au <select class="sel" name="au">${opt(F.au, "aujourd'hui")}</select></label><button type="submit">Appliquer</button></form>`;
  $("#period-form").addEventListener("submit", e => { e.preventDefault(); const u = new URL(location.href), f = e.target;
    u.searchParams.set("du", f.du.value || days[0].d);  // « début » = premier jour (le serveur ignore un paramètre vide) if (f.au.value) u.searchParams.set("au", f.au.value); else u.searchParams.delete("au");
    location.href = u.toString(); });
}

// ================================================================== textes
const verdict = v => v >= 70 ? "Très bon match" : v >= 55 ? "Bien joué" : v >= 45 ? "Match correct" : v >= 30 ? "Match en dessous" : "Mauvais match";
const verdictG = v => v >= 65 ? "Nettement au-dessus d'une performance SSL médiane" : v >= 55 ? "Au-dessus d'une performance SSL médiane"
  : v >= 45 ? "Au niveau d'une performance SSL médiane" : v >= 35 ? "Un peu en dessous d'une performance SSL médiane" : "En dessous d'une performance SSL médiane";
// formulations par indicateur : force (« tu … »), chantier (nom), duel (nom court)
const PH = {
  boost_zero: ["tu es rarement à sec de boost", "le temps à 0 boost", "le boost à sec"],
  boost_petits: ["tu vis sur les petits pads", "les petits pads", "les petits pads"],
  boost_vole: ["tu voles le boost adverse", "le vol de boost", "le boost volé"],
  boost_gaspille: ["tu gaspilles peu de boost", "le boost gaspillé", "le boost gaspillé"],
  vitesse: ["tu joues vite", "la vitesse", "la vitesse"],
  supersonique: ["tu restes supersonique", "le temps supersonique", "le supersonique"],
  lent: ["tu ralentis rarement", "le temps passé lent", "le temps lent"],
  ff_gagnes: ["tu gagnes tes 50/50", "les 50/50", "les 50/50"],
  ko_gagnes: ["tu gagnes tes kickoffs", "les kickoffs", "les kickoffs"],
  tirs: ["tu tires souvent", "le volume de tirs", "les tirs"],
  buts: ["tu finis tes actions", "la finition", "les buts"],
  frappes_fortes: ["tu frappes fort", "les frappes fortes", "les frappes fortes"],
  ratees: ["tu rates peu de balles", "les balles ratées", "la propreté"],
  passes: ["tu fais jouer tes coéquipiers", "les passes", "les passes"],
  demos: ["tu démolis souvent", "les démos", "les démos"],
  bumps: ["tu bouscules beaucoup", "les bumps", "les bumps"],
  moitie_adverse: ["tu presses haut", "la présence chez l'adversaire", "le pressing"],
  plc_note: ["tu te places comme un pro", "le placement", "le placement"],
  dec_note: ["tu choisis bien à la touche", "le choix à la touche", "le choix à la touche"],
  lobby_note: ["tes touches rapportent", "le résultat des touches", "le résultat des touches"],
  lobby_rank: ["tu pèses dans tes parties", "le rang dans la partie", "le rang dans la partie"],
};
const ph = (key, i, label) => PH[key]?.[i] ?? (label || key).toLowerCase();
// types de touche au singulier (les données les donnent au pluriel)
const ACT1 = { "Tirs": "Tir", "Arrêts": "Arrêt", "Dégagements": "Dégagement", "Passes": "Passe", "Frappes fortes": "Frappe forte", "Contrôles / autres": "Contrôle" };
const act1 = a => ACT1[a] ?? a;

// ================================================================== coquille
const TABS = ["ma-forme", "ce-match", "mon-jeu", "a-travailler", "mon-trio"];
function setupShell() {
  document.title = `${BASE.player} · RLPI`;
  $("#pname").textContent = BASE.player;
  $("#who").innerHTML = ALL.order.map(id => `<option value="${id}"${id === SEL ? " selected" : ""}>${esc((ALL.names || {})[id] || (ALL.profiles[id] || {}).player || id)}</option>`).join("");
  if (ALL.order.length < 2) $("#who-ctl").hidden = true;
  $("#who").addEventListener("change", e => { const u = new URL(location.href); u.searchParams.set("j", e.target.value); location.href = u.toString(); });
  $("#ref").innerHTML = ["ssl", "rlcs"].filter(k => BASE.refs[k]).map(k => `<option value="${k}">${BASE.refs[k].label}</option>`).join("");
  $("#ref").addEventListener("change", e => { REF = e.target.value; try { localStorage.setItem("rlpi-ref", REF); } catch (er) {} data(); renderAll(); });

    b.addEventListener("click", () => go(b.dataset.tab));
    b.addEventListener("keydown", e => {
      const vis = [...document.querySelectorAll(".tab:not([hidden])")], i = vis.indexOf(b);
      let j = null;
      if (e.key === "ArrowRight") j = (i + 1) % vis.length; else if (e.key === "ArrowLeft") j = (i - 1 + vis.length) % vis.length;

    });
  });

  $("#foot").textContent = `Généré le ${BASE.generated}. Données : ${BASE.n_matches} parties classées 3v3.`;
}
function go(tab) { if (location.hash.slice(1) === tab) route(); else location.hash = tab; }
// ouvre un match de la période (depuis n'importe quel bloc)
function openMatch(replay) { if (!PFM[replay]) return; ST.match = replay; go("ce-match"); window.scrollTo({ top: 0 }); }

function route() {
  let h = location.hash.slice(1) || "ma-forme";
  if (h === "ce-match/ralentis") h = "a-travailler";  // ancien lien : les ralentis sont dans « À travailler »
  const tab = h.split("/")[0];
  ST.tab = TABS.includes(tab) || tab === "tous" ? tab : "ma-forme";
  if (ST.tab === "mon-trio" && !PEERS.length) ST.tab = "ma-forme";
  $("#ref-ctl").hidden = !(ST.tab === "mon-jeu" || ST.tab === "tous");
  document.querySelectorAll(".tab").forEach(b => { const on = b.dataset.tab === ST.tab || (ST.tab === "tous" && b.dataset.tab === "mon-jeu");
    b.setAttribute("aria-selected", on); b.tabIndex = on ? 0 : -1; });
  document.querySelectorAll(".view").forEach(v => { const on = v.id === "view-" + ST.tab; v.hidden = !on;
    if (on) { v.classList.remove("enter"); void v.offsetWidth; v.classList.add("enter"); } });
  renderView(ST.tab);
  hideTip();
}
function ctx(s) { $("#ctx").textContent = s; }
const period = () => BASE.first === BASE.last ? dC(BASE.first) : `du ${dS(BASE.first)} au ${dC(BASE.last)}`;
function data() { if (!BASE.refs[REF]) REF = Object.keys(BASE.refs)[0]; D = { ...BASE, ...BASE.refs[REF] };
  M = Object.fromEntries(D.metrics.map(m => [m.key, m])); $("#ref").value = REF; }
function renderView(tab) {
  ({ "ma-forme": maForme, "ce-match": ceMatch, "mon-jeu": monJeu, "a-travailler": aTravailler, "mon-trio": monTrio, "tous": tous })[tab]();
}
function renderAll() { renderView(ST.tab); renderMethod(); }

function kpis(root) {

  if (V) {
    T.push({ k: "Rang dans la partie", m: "resultat", v: `${num(V.me_lobby_rank, 1)}<small>${NB}/ 6</small>`, s: "face à tes lobbies · 1 = meilleur des 6",
      c: peerLine(p => p.value?.lobby_rank == null ? null : num(p.value.lobby_rank, 1)) });
    if (V.plc) T.push({ k: "Placement hors ballon", m: "placement", v: `${R(V.plc.me_note)}<small>/100</small>`, s: `face aux pros RLCS · lobbies ${R(V.plc.lobby_note)}`,
      c: peerLine(p => p.value?.plc_note == null ? null : R(p.value.plc_note)) });
    T.push({ k: "Résultat de tes touches", m: "resultat", v: `${R(V.me_lobby_note)}<small>/100</small>`, s: "face à tes lobbies · 50 = médian",
      c: peerLine(p => p.value?.lobby_note == null ? null : R(p.value.lobby_note)) });
  }
  if (PS) { const g = PS.groups, me = g.find(x => x.key === "me"), lob = g.find(x => x.key === "lobby");
    T.push({ k: "Passes récupérées", m: "passes", v: `${Math.round(me.recovered * 100)}<small>${NB}%</small>`, s: `lobbies ${pc(lob?.recovered)}`,
      c: peerLine(p => { const x = g.find(y => y.key === p.id); return x ? pc(x.recovered) : null; }) }); }
  root.innerHTML = T.map(t => `<div class="pl-panel pl-cutr kpi">
    <div class="bt"><h3 class="pl-tag pl-muted">${t.k}</h3>${mi(t.m, t.k)}</div>

// composantes de l'indice : [forme longue avec article, forme courte, pluriel]
const COMP_PH = {
  impact: ["l'impact de tes touches", "ton impact", false], placement: ["ton placement hors ballon", "ton placement", false],
  duels: ["tes 50/50", "tes 50/50", true], boost: ["ta gestion du boost", "ton boost", false], vitesse: ["ta vitesse", "ta vitesse", false],
  fiabilite: ["ta fiabilité (peu de ratés)", "ta fiabilité", false], collectif: ["ton jeu collectif", "ton jeu collectif", false],
};
const cph = (c, i) => COMP_PH[c.key]?.[i] ?? c.label.toLowerCase();
// phrase de lecture d'un match : rang + composante la plus lourde (+ compensation)
function matchSentence(m, withVerdict = true) {
  const comps = [...PF.components].sort((a, b) => b.weight - a.weight);
  const top = comps[0], s = m.comps[top.key];
  let out = (withVerdict ? `${verdict(m.index)} : ` : "") + `${ord(m.rank)} sur ${m.n_players}. `;
  out += `${cap(cph(top, 0))} ${COMP_PH[top.key]?.[2] ? "pèsent" : "pèse"} ${Math.round(top.weight * 100)}${NB}% de la note et ${s >= 50 ? "monte" : "tombe"}${COMP_PH[top.key]?.[2] ? "nt" : ""} à ${R(s)}/100.`;
  const rest = comps.slice(1).filter(c => c.weight >= .05);
  if (m.index < 50) { const c = rest.filter(c => m.comps[c.key] >= 55).sort((a, b) => m.comps[b.key] - m.comps[a.key])[0];
    if (c) out += ` ${cap(cph(c, 1))} (${R(m.comps[c.key])}) ne ${COMP_PH[c.key]?.[2] ? "compensent" : "compense"} pas.`; }
  else { const c = rest.filter(c => m.comps[c.key] < 45).sort((a, b) => m.comps[a.key] - m.comps[b.key])[0];
    if (c) out += ` ${cap(cph(c, 1))} ${COMP_PH[c.key]?.[2] ? "restent" : "reste"} en retrait (${R(m.comps[c.key])}).`; }
  return out;
}

function board(m) {
  let rows = [{ name: BASE.player, v: m.index, kind: "me", cls: "me" },
    ...m.mates.map(x => { const p = peerByName(x.name); return { name: x.name, v: x.index, kind: p ? p.slot : "other", cls: "mate" }; })];
  if (m.opps?.length) rows.push(...m.opps.map(o => ({ name: o.name, v: o.index, kind: "none", cls: "opp" })));
  rows.sort((a, b) => b.v - a.v);
  const full = !!m.opps?.length;
  if (!full) rows.push({ name: "Adv. (moy.)", v: m.opp_mean, kind: "ref", cls: "opp", norank: true });
  return rows.map((r, k) => `<div class="pl-row ${r.cls}"><span class="pl-dx rk">${r.norank ? "–" : r.kind === "me" ? m.rank : full ? k + 1 : "–"}</span>
    ${r.kind === "none" ? `<span class="sym"></span>` : sym(r.kind)}<span class="pl-dx nm">${esc(r.name)}${r.cls === "opp" && !r.norank ? "" : ""}</span><span class="pl-dx vl">${R(r.v)}</span></div>`).join("")
    + (full ? `<p class="pl-small pl-muted note">En gris : les adversaires.</p>` : "");
}

    txt(svg, L - 6, Y(v) + 4, v > 0 ? "+1" : v < 0 ? MINUS + "1" : "0", { "text-anchor": "end" }); });
  const segs = []; let cur = [];
  c.v.forEach((v, k) => { if (v == null) { if (cur.length) segs.push(cur); cur = []; } else cur.push([k, v]); }); if (cur.length) segs.push(cur);
  segs.forEach(sg => { const d = `M${X(sg[0][0])},${Y(0)} ` + sg.map(([k, v]) => `L${X(k).toFixed(1)},${Y(v).toFixed(1)}`).join(" ") + ` L${X(sg[sg.length - 1][0])},${Y(0)} Z`;
    el("path", { d, fill: "var(--good)", "clip-path": "url(#cu)" }, svg); el("path", { d, fill: "var(--bad)", "clip-path": "url(#cd)" }, svg); });
  c.goals.forEach(g => el("line", { x1: X(g.k), x2: X(g.k), y1: T, y2: H - B, stroke: g.pour ? "var(--good-on-dark)" : "var(--bad)", "stroke-width": 2, ...(g.pour ? {} : { "stroke-dasharray": "4 3" }) }, svg));
  c.touches.forEach(t => { const v = c.v[Math.min(t.k, N - 1)] ?? 0, x = X(t.k), y = Y(v), s = 4 + Math.min(Math.abs(t.dv) * 10, 4);
    const p = el("path", { d: `M${x},${y - s} L${x + s},${y} L${x},${y + s} L${x - s},${y} Z`, fill: t.dv >= 0 ? "var(--me)" : "var(--surface)", stroke: "var(--me)", "stroke-width": 1.5 }, svg);
    hover(p, `<b>${esc(t.a)}</b> · gain ${sgn(t.dv)}`); });
  txt(svg, L, H - 4, "début"); txt(svg, W - Rr, H - 4, "fin", { "text-anchor": "end" });

        "<b>Note</b> = centile si « plus haut = mieux », 100 − centile si « plus bas = mieux » (temps à 0 boost, balles ratées…). « Mieux que 80 % » = note 80.",
        ...(SHOW_RLPI_CATS ? ["<b>Note de catégorie RLPI</b> = moyenne des notes de ses indicateurs. Les indicateurs de style (temps en l'air, 1er homme…) n'ont pas de bon sens et n'y entrent pas."] : []),
        "<b>Face-à-face</b> (Mon trio) : uniquement les parties jouées dans la même équipe ; moyenne par partie de chacun. La valeur gagnante est celle qui va dans le bon sens de l'indicateur."],
      read: [`<b>Référence SSL</b> : ${BASE.refs.ssl ? BASE.refs.ssl.n_ref_players + " joueurs vus dans " + BASE.refs.ssl.n_ref_matches : "des"} parties classées 3v3 où les 6 joueurs sont Supersonic Legend (replays publics ballchasing). La plus juste pour toi : même mode, même type de partie.`,
        `<b>Référence RLCS</b> : ${BASE.refs.rlcs ? BASE.refs.rlcs.n_ref_players + " pros ayant au moins 2 matchs parmi " + BASE.refs.rlcs.n_ref_matches : "des"} matchs RLCS 2026.`, "Tu changes de référence avec « Comparer à », en haut de la page."],

    { id: "styles", title: "Styles de jeu",

    { id: "conseils", title: "Conseils",

    { id: "progression", title: "Progression",

      steps: ["Pour l'indice, ses deux sous-notes, ses 7 composantes et tes mesures techniques : moyenne des parties récentes moins moyenne des parties d'avant (orientée pour que ▲ = mieux).",
        "Classement par taille de l'écart rapportée à la variation habituelle de la mesure.",

      limits: ["Une note de match est volatile : une progression « nette » sur 10 parties peut encore être en partie due au hasard.", "Ne distingue pas les progrès des changements d'adversaires ou de coéquipiers."] },
    { id: "synergie", title: "Synergie entre coéquipiers",

        "On regarde qui touche ensuite la balle : un coéquipier = récupérée, un adversaire = perdue.",
        "On regarde si un coéquipier était en position : 1 s après ta touche, ton coéquipier le plus proche de la balle en est-il plus près que l'adversaire le plus proche ?",
        "Une passe <b>dans le vide</b> = personne en position et balle perdue. Les 10 plus coûteuses sont classées par gain à 2 s (valeur 2 s après − valeur 0,2 s avant)."],
      read: ["Beaucoup de balles « récupérées sans coéquipier placé » = tes coéquipiers lisent bien tes passes dans l'espace.", "Beaucoup de passes dans le vide dans le tiers offensif = des centres ou remises que personne n'attend."],
      limits: ["La fenêtre d'1 s est courte : une longue passe dans l'espace récupérée plus tard par un coéquipier lancé compte comme « personne en position » (mais bien comme récupérée).", "Ne distingue pas une passe voulue d'une touche ratée qui part dans la même direction."] },
    { id: "style", title: "Répartitions du temps (style de jeu)",
      what: "Comment ton temps de jeu se partage entre rôles, zones, réserves de boost, hauteurs, vitesses et types de touche.",
      steps: ["Le lecteur de replays (subtr-actor 1.5.1) classe chaque instant : rôle dans la rotation, tiers du terrain, position par rapport à la balle, tranche de boost, au sol ou en l'air, vitesse, et chaque touche selon sa force.",

function caveats() {
  return [
    `<b>Échantillon réduit</b> : ${BASE.n_matches} parties. Les centiles et les écarts entre joueurs bougent encore beaucoup.`,
    `<b>Référence SSL</b> : parties classées 3v3 où les 6 joueurs sont Supersonic Legend. Comparaison la plus juste, mais chaque joueur SSL n'apparaît que dans 1 ou 2 parties : sa moyenne est bruitée. <b>Référence RLCS</b> : tes parties sont des classées, la référence des matchs pro ; un écart de rythme ou de prise de risque est attendu.`,
    `<b>Résultat de tes touches</b> : comparé aux autres joueurs de tes parties, pas aux pros. En classé, les défenses encaissent ${V?.ranked_goal_ratio ?? 1.5}× plus de buts que ne le prévoit le modèle appris sur les pros.`,
    `<b>Placement hors ballon</b> : écart entre ta position et celle qu'aurait un pro dans la même situation. <b>Choix à la touche</b> : encore expérimental, ne pas s'y fier.`,
    ...(PF ? [`<b>Indice de performance</b> : ses poids viennent de ce qui fait gagner en SSL, donc l'impact des touches domine (${Math.round(PF.components.find(c => c.key === "impact").weight * 100)} %). Le placement y pèse presque rien : à ce niveau il ne sépare pas gagnants et perdants, ce qui ne veut pas dire qu'il ne compte pas. Sur ${PF.me.n} parties, l'indice global a une marge d'environ ±${Math.round((PF.me.hi - PF.me.lo) / 2)} points.`] : []),
    `Les stats brutes viennent des détecteurs de subtr-actor 1.5.1 (50/50, ratées, rôles…), pas encore vérifiés à la main sur des extraits vidéo.`,
  ];
}
function renderMethod() {
  const G = glossary(), li = a => a.filter(Boolean).map(x => `<li>${x}</li>`).join("");
  const extra = [{ id: "alire", title: "À lire avant d'interpréter" }, { id: "defs", title: "Définitions des indicateurs" }];
  $("#method-toc").innerHTML = [...G, ...extra].map(g => `<a href="#g-${g.id}" data-goto="${g.id}">${g.title}</a>`).join("");
  $("#method-body").innerHTML = G.map(g => `<section id="g-${g.id}" tabindex="-1"><h3 class="pl-dx">${g.title}</h3><p class="pl-body">${g.what}</p>
      <h4 class="pl-tag">Comment c'est calculé</h4><ol>${li(g.steps)}</ol>${g.example ? `<h4 class="pl-tag">Exemple</h4><p class="ex">${g.example}</p>` : ""}
      <h4 class="pl-tag">Comment le lire</h4><ul>${li(g.read)}</ul><h4 class="pl-tag">Ce que ça ne dit pas</h4><ul>${li(g.limits)}</ul></section>`).join("")
    + `<section id="g-alire" tabindex="-1"><h3 class="pl-dx">À lire avant d'interpréter</h3><ul>${li(caveats())}</ul></section>`
    + `<section id="g-defs" tabindex="-1"><h3 class="pl-dx">Définitions des indicateurs</h3><p>${SRC}</p><ul>${D.metrics.map(m => `<li><b>${esc(m.label)}</b> (${esc(m.unit)}${m.sens === 0 ? ", style" : m.sens > 0 ? ", plus haut = mieux" : ", plus bas = mieux"}) : ${METRIC_DEF[m.key] || ""}</li>`).join("")}${(BASE.tech?.rows || []).map(t => `<li><b>${esc(t.label)}</b> (technique) : ${esc(t.def)}</li>`).join("")}</ul></section>`;
  $("#method-toc").querySelectorAll("[data-goto]").forEach(a => a.addEventListener("click", e => { e.preventDefault(); focusRubric(a.dataset.goto); }));
}
let methodOpener = null;
function focusRubric(id) { const s = document.getElementById("g-" + id); if (!s) return;
  document.querySelectorAll("#method section.hit").forEach(x => x.classList.remove("hit")); s.classList.add("hit");
  s.scrollIntoView({ block: "start" }); s.focus({ preventScroll: true }); }
function openMethod(id, opener) {
  const p = $("#method"); methodOpener = opener || document.activeElement;
  if (p.hidden) { p.hidden = false; p.classList.remove("enter"); void p.offsetWidth; p.classList.add("enter"); }
  focusRubric(id || "indice");
}
function closeMethod() { $("#method").hidden = true; if (methodOpener && document.contains(methodOpener)) methodOpener.focus(); }
document.addEventListener("click", e => {
  const b = e.target.closest("[data-m]"); if (b) { e.preventDefault(); openMethod(b.dataset.m, b); return; }
  const p = $("#method"); if (!p.hidden && !p.contains(e.target)) closeMethod();
});
$("#method-close").addEventListener("click", closeMethod);
document.addEventListener("keydown", e => {
  const p = $("#method"); if (p.hidden) return;
  if (e.key === "Escape") { e.preventDefault(); closeMethod(); return; }
  if (e.key === "Tab") { // focus piégé dans le panneau
    const f = [...p.querySelectorAll("button, a[href], [tabindex]:not([tabindex='-1'])")].filter(x => !x.disabled && x.offsetParent !== null);
    if (!f.length) return; const first = f[0], last = f[f.length - 1];
    if (!p.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
    else if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});

// ================================================================== démarrage
data(); setupShell(); renderMethod();
addEventListener("hashchange", route);
route();
let lastW = innerWidth, rz = null;
addEventListener("resize", () => { if (Math.abs(innerWidth - lastW) < 8) return; lastW = innerWidth;
  clearTimeout(rz); rz = setTimeout(() => renderView(ST.tab), 150); });
</script>
